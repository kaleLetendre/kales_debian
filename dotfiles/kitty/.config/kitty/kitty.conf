# kitty.conf - behaviour + mouse defaults. Stowed into ~/.config/kitty/.
#
# Colors live in current-theme.conf (included below), not here. Run the
# `theme` command to browse + live-preview themes; picking one rewrites
# current-theme.conf. Keeping behaviour and palette separate is what lets
# the picker swap themes without touching this file.

# --- behaviour ---------------------------------------------------------
enable_audio_bell      no
# CLIs like Claude Code ring the terminal bell each turn; with audio off
# that still lit up the window border / tab / i3 taskbar entry when the
# window was unfocused. Silence the visual + urgency alert too so the
# bell is a no-op.
window_alert_on_bell   no
bell_on_tab            no
scrollback_lines       10000
cursor_blink_interval  0
window_padding_width   4
confirm_os_window_close 0

# --- mouse -------------------------------------------------------------
# kitty defaults to ctrl+shift+click to open links and right-click to
# extend selection. Remap to match muscle memory from other terminals:
# ctrl+click opens the link under the cursor, right-click copies the
# current selection to the clipboard (replaces extend-selection).
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map right press   ungrabbed              copy_to_clipboard

# --- scrollback keys ---------------------------------------------------
# kitty only binds ctrl+shift+pageup / ctrl+shift+arrows to scroll by
# default. Restore the xfce4-terminal / xterm muscle memory: bare
# shift+pageup/pagedown by page, shift+up/down by line. The ctrl+shift+
# defaults still work too. (If a TUI app ever needs shift+arrows, drop
# the two line-scroll maps.)
map shift+page_up    scroll_page_up
map shift+page_down  scroll_page_down
map shift+up         scroll_line_up
map shift+down       scroll_line_down

# --- window naming -----------------------------------------------------
# ctrl+shift+r prompts for a title and pins it to this window, so a pile of
# Claude Code sessions don't all read "claude" in the i3 titlebar/taskbar.
#
# i3 shows kitty's *window* (pane) title, which the running program keeps
# rewriting via escape codes. set_tab_title only renames the (hidden,
# single-tab) tab, which i3 ignores -- so instead we set the window title
# over remote control:
#   - an overlay prompts for the name (read -p)
#   - --allow-remote-control scopes a remote-control socket to just this
#     overlay; no global allow_remote_control needed
#   - @active-kitty-window-id is replaced with the id of the window we were
#     in (resolved before the overlay opens), so --match id: hits it exactly
#   - no --temporary => kitty pins the name and ignores later title changes
#     from the program, so what you type sticks
# Submit an empty line to leave the title unchanged.
map ctrl+shift+r launch --type=overlay --allow-remote-control bash -c 'read -r -p "Window title: " t; [ -n "$t" ] && kitten @ set-window-title --match id:"$1" -- "$t"' rename @active-kitty-window-id

# --- colors ------------------------------------------------------------
# Managed by the `theme` command (kitten themes). It edits within these
# BEGIN/END markers, so leave them in place.
# BEGIN_KITTY_THEME
# Constant Perceptual Luminosity (dark)
include current-theme.conf
# END_KITTY_THEME
