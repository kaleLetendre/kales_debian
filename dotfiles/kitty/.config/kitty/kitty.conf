# kitty.conf - behaviour + mouse defaults. Stowed into ~/.config/kitty/.
#
# Colors live in current-theme.conf (included below), not here. Run the
# `theme` command to browse + live-preview themes; picking one rewrites
# current-theme.conf. Keeping behaviour and palette separate is what lets
# the picker swap themes without touching this file.

# --- font ---------------------------------------------------------------
# A Nerd Font, installed by setup/69-neovim.sh. Neovim's file tree,
# statusline and git gutter draw glyphs from the Nerd Font private use
# area; without a patched font every icon renders as a replacement box.
# Applies to the whole terminal, not just nvim -- starship-style prompts
# and eza icons want the same glyphs.
font_family            JetBrainsMono Nerd Font
font_size              11.0

# --- behaviour ---------------------------------------------------------
enable_audio_bell      no
# CLIs like Claude Code ring the terminal bell each turn; with audio off
# that still lit up the window border / tab / i3 taskbar entry when the
# window was unfocused. Silence the visual + urgency alert too so the
# bell is a no-op.
window_alert_on_bell   no
bell_on_tab            no
scrollback_lines       10000
cursor_blink_interval  0
window_padding_width   4
confirm_os_window_close 0

# --- clipboard ---------------------------------------------------------
# kitty's default is write-clipboard write-primary read-clipboard-ask
# read-primary-ask: a program may *set* the clipboard freely, but reading it
# pops a permission dialog, on the reasonable grounds that anything running
# in the terminal could otherwise scrape whatever you last copied.
#
# That default makes ctrl+v a two-step confirmation in nvim over ssh, where
# the clipboard necessarily travels by OSC 52 escape sequence (no X display
# on the far end -- see the comment in nvim's config/options.lua). Grant
# read-clipboard so paste is one keystroke.
#
# Scope of what this gives up: any program running in a kitty window can now
# read the CLIPBOARD selection without asking. PRIMARY (the middle-click
# selection) still prompts, and that is left alone.
clipboard_control write-clipboard write-primary read-clipboard read-primary-ask

# --- mouse -------------------------------------------------------------
# kitty defaults to ctrl+shift+click to open links and right-click to
# extend selection. Remap to match muscle memory from other terminals:
# ctrl+click opens the link under the cursor, right-click copies the
# current selection to the clipboard (replaces extend-selection).
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map right press   ungrabbed              copy_to_clipboard

# --- scrollback keys ---------------------------------------------------
# kitty only binds ctrl+shift+pageup / ctrl+shift+arrows to scroll by
# default. Restore the xfce4-terminal / xterm muscle memory: bare
# shift+pageup/pagedown by page, shift+up/down by line. The ctrl+shift+
# defaults still work too.
map shift+page_up    scroll_page_up
map shift+page_down  scroll_page_down
map shift+up         scroll_line_up
map shift+down       scroll_line_down

# --- give the arrows back to the editor --------------------------------
# kitty's ctrl+shift+arrow defaults (previous/next tab, scroll) swallow the
# keys nvim needs for word-wise shift-selection before nvim ever sees them.
#
# Two earlier attempts failed, both relying on kitty *not* handling the key:
# `map --when-focus-on var:in_editor <key>` (conditional unmap, driven by nvim
# setting a user variable) and then a plain `map <key>` (unconditional unmap).
# Neither delivered the key -- verified by logging what actually arrives in
# nvim: <S-Right> did, <C-S-Right> never.
#
# So stop asking kitty to step aside and have it send the bytes itself.
# send_text is unambiguous: kitty consumes the chord and writes exactly these
# bytes to the terminal. \x1b[1;6C is the standard encoding for
# ctrl+shift+right (CSI 1 ; modifiers C, where 6 = shift+ctrl), which is what
# nvim decodes into <C-S-Right> -- the key 'keymodel=startsel' extends a
# selection by word with.
#
# `all` means send it whether or not the app has set the cursor-key
# application mode, so this does not depend on terminal state either.
map ctrl+shift+right send_text all \x1b[1;6C
map ctrl+shift+left  send_text all \x1b[1;6D
map ctrl+shift+up    send_text all \x1b[1;6A
map ctrl+shift+down  send_text all \x1b[1;6B
map ctrl+shift+home  send_text all \x1b[1;6H
map ctrl+shift+end   send_text all \x1b[1;6F

# The picker chords the editor layer uses. Plain unmaps: nothing here needs a
# specific byte sequence, they just need kitty to keep its hands off. Given
# up: e opened a URL with hints, f moved the window forward, k scrolled a
# line, z jumped to the previous prompt, p prefixed kitty's key sequences.
map ctrl+shift+e
map ctrl+shift+f
map ctrl+shift+k
map ctrl+shift+p
map ctrl+shift+z

# --- window naming -----------------------------------------------------
# ctrl+shift+r prompts for a title and pins it to this window, so a pile of
# Claude Code sessions don't all read "claude" in the i3 titlebar/taskbar.
#
# i3 shows kitty's *window* (pane) title, which the running program keeps
# rewriting via escape codes. set_tab_title only renames the (hidden,
# single-tab) tab, which i3 ignores -- so instead we set the window title
# over remote control:
#   - an overlay prompts for the name (read -p)
#   - --allow-remote-control scopes a remote-control socket to just this
#     overlay; no global allow_remote_control needed
#   - @active-kitty-window-id is replaced with the id of the window we were
#     in (resolved before the overlay opens), so --match id: hits it exactly
#   - no --temporary => kitty pins the name and ignores later title changes
#     from the program, so what you type sticks
# Submit an empty line to leave the title unchanged.
map ctrl+shift+r launch --type=overlay --allow-remote-control bash -c 'read -r -p "Window title: " t; [ -n "$t" ] && kitten @ set-window-title --match id:"$1" -- "$t"' rename @active-kitty-window-id

# --- colors ------------------------------------------------------------
# Managed by the `theme` command (kitten themes). It edits within these
# BEGIN/END markers, so leave them in place.
# BEGIN_KITTY_THEME
# Constant Perceptual Luminosity (dark)
include current-theme.conf
# END_KITTY_THEME
